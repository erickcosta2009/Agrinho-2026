<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Terra - Agrinho 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cultivando com Carinho</h1>
        <p>Clique nas imagens para explorar nossas raízes</p>
    </header>

    <main class="container">
        <section class="galeria-humana">
            <div class="foto-card" onclick="abrirFoto('img1')">
                <img src="https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=500&q=80" alt="Plantação" id="img1">
                <div class="legenda">O ciclo da água no campo</div>
            </div>

            <div class="foto-card" onclick="abrirFoto('img2')">
                <img src="https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&w=500&q=80" alt="Mãos na terra" id="img2">
                <div class="legenda">O toque humano na semente</div>
            </div>
        </section>

        <div id="janelaGrande" class="overlay" onclick="fecharFoto()">
            <span class="fechar">&times;</span>
            <img class="conteudo-grande" id="fotoExpandida">
            <div id="legendaGrande"></div>
        </div>
    </main>

    <footer>
        <p>Projeto Agrinho - Equilíbrio e Sustentabilidade</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
